<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - ScholarSync Subic</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'accounts/favicon.png' %}">
    <style>
        :root {
            --brand-primary: #10B981;
            --brand-secondary: #F59E0B;
            --brand-gradient: linear-gradient(135deg, #10B981 0%, #F59E0B 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --bg-surface: #ffffff;
            --radius-xl: 1.5rem;
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
        }

        .auth-card {
            background: var(--bg-surface);
            width: 100%;
            max-width: 440px;
            padding: 3.5rem 2.5rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--brand-gradient);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: var(--brand-primary);
            font-size: 2.5rem;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-family: 'Raleway', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1.25rem;
            text-align: left;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 1.5rem;
        }

        .info-box i {
            color: #3b82f6;
            margin-right: 0.5rem;
        }

        .auth-button {
            display: block;
            width: 100%;
            padding: 1rem;
            background: white;
            color: var(--brand-primary);
            border: 2px solid var(--brand-primary);
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: 2rem;
        }

        .auth-button:hover {
            background: var(--brand-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="success-icon">
            <i class="fa-regular fa-envelope"></i>
        </div>
        <h1>Check your email</h1>
        <p class="subtitle">
            We've emailed you instructions for setting your password, if an account exists with the email you entered.
        </p>
        
        <div class="info-box">
            <p style="margin-bottom: 0.75rem; font-weight: 700; color: var(--text-primary);">
                <i class="fa-solid fa-circle-info"></i> Didn't receive an email?
            </p>
            <ul style="margin: 0; padding-left: 1.25rem; line-height: 1.5;">
                <li>Check your spam folder</li>
                <li>Verify the email address entered</li>
            </ul>
        </div>

        <a href="{% url 'accounts:login' %}" class="auth-button">
            Return to Login
        </a>
    </div>
</body>

</html>
