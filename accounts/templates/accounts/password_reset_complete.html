<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - ScholarSync Subic</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'accounts/favicon.png' %}">
    <style>
        :root {
            --brand-primary: #10B981;
            --brand-secondary: #F59E0B;
            --brand-gradient: linear-gradient(135deg, #10B981 0%, #F59E0B 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --bg-surface: #ffffff;
            --radius-xl: 1.5rem;
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
        }

        .auth-card {
            background: var(--bg-surface);
            width: 100%;
            max-width: 440px;
            padding: 3.5rem 2.5rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--brand-gradient);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: var(--brand-primary);
            font-size: 2.5rem;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-family: 'Raleway', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .submit-btn {
            display: block;
            background: var(--brand-gradient);
            color: white;
            text-decoration: none;
            padding: 1.125rem;
            border-radius: 0.75rem;
            font-size: 1.125rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.3);
        }

        .footer-text {
            margin-top: 2rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="header" style="margin-bottom: 1.5rem;">
            <img src="{% static 'accounts/scholarsync_logo.png' %}" alt="ScholarSync" style="width: 70px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); margin-bottom: 1rem;">
        </div>
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>All Set!</h1>
        <p class="subtitle">Your password has been reset successfully. You can now access your account using your new credentials.</p>

        <a href="{% url 'accounts:login' %}" class="submit-btn">Log in to Account</a>
        
        <p class="footer-text">Need help? <a href="mailto:scholarsyncsubic@gmail.com" style="color: var(--brand-primary); text-decoration: none; font-weight: 600;">Contact Support</a></p>
    </div>
</body>

</html>
